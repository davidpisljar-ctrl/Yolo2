; ============================================================
; RTSP YOLO Multicam – SETTINGS
; Verzija: v4.8
; ------------------------------------------------------------
; Ta datoteka določa:
;   - minimalno verjetnost za zapis v CSV,
;   - katere YOLO razrede se beleži,
;   - koliko časa mora preteči med zapisi istega razreda
;     (cooldown, da preprečimo preveč zapisov),
;   - lokacijo CSV datoteke.
; ============================================================


[general]
# Debug izpis v terminal
debug = False

# YOLO model to load (must be in YOLO_MODELS_FOLDER)
# Examples:
# yolov8n.pt
# yolov8s.pt
# yolov8m.pt
# yolov8l.pt
# yolov8x.pt
# license-plate-finetune-v1m.pt
# policijska_vozila_v3_9_12_2025_yolo11m.pt
YOLO_MODEL = yolov8m-worldv2.pt
#0 → izklopljen throttling (originalno delovanje)
stream_fps = 10

; Minimalna verjetnost zaznave za zapis v CSV (0.0–1.0)
; Primer: 0.60 pomeni 60 %
confidence_threshold = 0.70

; Pot do datoteke, v katero se zapisujejo vse YOLO zaznave
; Če datoteka ne obstaja, jo program ustvari
log_file = logs/detections.csv

; Časovni zamik (v sekundah) med zaporednimi zapisi istega razreda
; per-kamera (npr. če Kamera 1 zazna "car", 2 sekundi nato ignorira
; nove zapise "car" iz te iste kamere) !!! ČE UPORABLAMO DEEPTRACKER NASTAVIMO NA 0!!!
log_cooldown_seconds = 0

# Prikaz YOLO anotacij
SHOW_BOXES = True      
; True/False — prikaz bounding boxov
SHOW_LABELS = True    
; prikaz imena objekta
SHOW_CONFIDENCE = True  
; prikaz % zaupanja

# Logiranje po YOLO prepoznavi DA/NE
yolo_logging = False

[tracker]
# Ali se sledenje sploh uporablja
enabled = True

# Ali se naj rišejo DeepSORT okvirji in ID številke
draw_boxes = True
draw_ids = True

# Logiranje po DeepSORT DA/NE oziroma po novem ByteTrack
tracker_logging = True
tracker_log_file = logs/tracker_detections.csv

# Omogočeni printscreeni, mapa za printscreene, ali delamo celotne printscreene, ali delamo samo printscreene v boxih
tracker_printscreen = True
tracker_printscreen_box_dir = tracker_printscreen_box
tracker_printscreen_full_dir = tracker_printscreen_full
tracker_printscreen_full_image = True
tracker_printscreen_box_image = True


# NOVI parametri za ByteTrack

# Minimalni confidence YOLO detekcije za začetek novega tracka
track_thresh = 0.4

# IoU threshold za ujemanje detekcij in obstoječih trackov
match_thresh = 0.5

# Koliko frame-ov lahko objekt izgine, preden se track izbriše
track_buffer = 120

# Frame rate, pomemben za predikcijo v Kalman filterju
frame_rate = 10

[filters]
; YOLO razredi, ki naj se zapišejo v CSV (ločeni z vejico).
; Če je prazno, se beležijo VSE zaznave.
;
; PRIMERI:
;   classes =
;   classes = person,car
;   classes = person,car,dog
;
classes = person, bicycle, car, motorcycle, bus, truck, dog, bear, cat, License_Plate, police_car


