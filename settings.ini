; ============================================================
; KONEC SETTINGS.DATOTEKE
; ============================================================

; ============================================================
;DEEPSORT PARAMETRI
; ============================================================
;max_age
;max_age = 40
;👉 Koliko frame-ov lahko objekt manjka, preden ga tracker "pozabi".
;Če imaš FPS ~20, potem 40 frame-ov ≈ 2 sekundi.
;Višje = bolj tolerantno
;objekt se skrije za steber, gre za avto, pride nazaj → isti ID ostane
;Nižje = agresivno
;če izgine za 0.5 sekunde → dobi nov ID
;Priporočeno:
;statične kamere: 30–70
;veliko ljudi + križanje: 20–40
;hitro premikajoči objekti: 10–20


;n_init
;n_init = 2
;👉 Koliko zaporednih detekcij je potrebnih, da se zares ustvari track ID.
;S tem preprečiš, da bi šum ali napačna detekcija ustvarila ID, ki takoj izgine.
;Višje = bolj robustno, ampak počasneje dobi ID
;Nižje = hitrejše, a bolj šumno
;Priporočeno:
;ljudje: 2–3
;promet: 1–2
;slabe kamere: 3–4

;max_iou_distance
;max_iou_distance = 0.7
;👉 Koliko se lahko nova detekcija prostorsko razlikuje od predhodne (iou = overlap).
;Uporablja se za povezovanje detekcij med frame-i.
;0.7 je zelo tolerantno
;0.3 je zelo strogo
;Če objekt hitro spreminja pozicijo (skoči med frame-i), ti bo prenizka vrednost razbila tracking.
;Priporočeno:
;ljudje (hitrejši premiki): 0.6–0.8
;vozila (zelo stabilni bounding boxi): 0.4–0.6

;max_cosine_distance
;max_cosine_distance = 0.25
;👉 To je ključno: vizualna podobnost med objekti (embedder).
;Tracker primerja appearance feature vector-je.
;Nižje = zelo strogo (objekti morajo biti ZELO podobni)
;Višje = bolj tolerantno, ampak lahko pomeša podobne osebe
;0.25 je idealna vrednost po DeepSORT dokumentaciji.
;Priporočeno:
;notranji prostori, malo ljudi: 0.2
;zunaj, gibanje, prehodi: 0.25–0.3
;zelo različni objekti (npr. barvni tovornjaki): 0.3–0.4

;nn_budget
;nn_budget = 100
;👉 Koliko preteklih feature vectorjev se shrani za ID.
;Več = bolj robustno, ampak počasneje
;Manj = hitreje, manj natančno
;Če imaš zelo veliko trackov, prevelik buffer pomeni slabšo hitrost.
;Priporočeno:
;default (100) je OK
;visoke ločljivosti + veliko ljudi → 150–200
;low-end GPU → 50–100

